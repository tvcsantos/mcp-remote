name: Release
on:
  push:
    branches:
      - main
jobs:
  test:
    environment: release
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    env:
      # Every npm name a release is published under, one per line, from the NPM_PACKAGE_NAMES
      # GitHub variable (the `release` environment's, else the repository's). The repo keeps the
      # unscoped name and only what CI publishes is renamed. semantic-release publishes the first;
      # the last step publishes the rest. Unset or empty, a release is published under the name
      # in package.json.
      NPM_PACKAGE_NAMES: ${{ vars.NPM_PACKAGE_NAMES }}
    steps:
      - name: setup repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Setup NodeJS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm install
      - name: Run lint
        run: pnpm lint
      - name: Check for unused files, exports and dependencies
        run: pnpm knip
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm build
      # package.json names upstream as the repository. semantic-release releases against that
      # repository, and npm checks provenance against it, so in CI it has to be the one running.
      - name: Point the package at this repository
        run: npm pkg set repository="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      # Credits whoever maintains this copy, from the NPM_PACKAGE_CONTRIBUTORS GitHub variable: one
      # per line, as "Name <email> (url)" with the email and url optional. They are added after
      # any contributors package.json already has, and `author` stays the original author.
      - name: Add the package contributors
        if: vars.NPM_PACKAGE_CONTRIBUTORS != ''
        run: |
          i=$(node -p "(require('./package.json').contributors || []).length")
          # Trimmed and without blank lines; values typed in the GitHub UI can carry \r.
          awk 'NF { gsub(/^[ \t\r]+|[ \t\r]+$/, ""); print }' <<<"$NPM_PACKAGE_CONTRIBUTORS" |
            while IFS= read -r contributor; do
              npm pkg set "contributors[$i]=$contributor"
              i=$((i + 1))
            done
        env:
          NPM_PACKAGE_CONTRIBUTORS: ${{ vars.NPM_PACKAGE_CONTRIBUTORS }}
      # Scoped packages are private unless published as public. A variable saved in the GitHub UI
      # has \r\n line endings, and a \r left on the name ends up in the published tarball, where
      # the registry refuses it, so it is stripped here and in the last step.
      - name: Scope the package name
        run: |
          name=$(tr -d '\r' <<<"$NPM_PACKAGE_NAMES" | awk 'NF { print $1; exit }')
          if [ -z "$name" ]; then
            echo "No package names listed; publishing as $(npm pkg get name)"
            exit 0
          fi
          npm pkg set name="$name" publishConfig.access=public
      - name: Release
        run: pnpm semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Publishes the release on this commit under every name, the first included. A name that
      # already has it is skipped, so rerunning the workflow after a failed publish fills in only
      # what is missing. A commit with no release tag has nothing to publish.
      - name: Publish under every package name
        run: |
          tag=$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null) || {
            echo "No release on this commit"
            exit 0
          }
          version=${tag#v}
          npm pkg set version="$version"
          names=$(tr -d '\r' <<<"$NPM_PACKAGE_NAMES" | awk 'NF { print $1 }')
          [ -n "$names" ] || names=$(npm pkg get name | tr -d '"')
          failed=0
          for name in $names; do
            npm pkg set name="$name"
            if out=$(npm publish --ignore-scripts 2>&1); then
              echo "$out"
            elif grep -q 'previously published' <<<"$out"; then
              echo "$name@$version is already on npm"
            else
              echo "$out"
              echo "::error::Publishing $name@$version failed"
              failed=1
            fi
          done
          exit $failed
